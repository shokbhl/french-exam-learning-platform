name: Quality gate
#
# Note on `npm install` vs `npm ci`: npm 11 produces a lock file that its
# own `npm ci` rejects. The wasm32-wasi optional packages
# (@tailwindcss/oxide-wasm32-wasi, @img/sharp-wasm32,
# @unrs/resolver-binding-wasm32-wasi) declare bundled @emnapi dependencies
# at conflicting ranges; they never install on linux-x64, but `npm ci`
# validates their ranges regardless and fails. The committed lock file
# still determines versions for `npm install`.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # See the note at the top of this file on why not `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
  # Applies every migration to a throwaway database and asserts the row level
  # security policies from the perspective of each role. The pgvector image is
  # required because the retrieval schema creates the extension and an HNSW
  # index.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # See the note at the top of this file on why not `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Apply migrations and run RLS tests
        run: ./tests/db/run.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Verify generated types match the migrations
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts \
            || (echo "::error::database.types.ts is stale; run npm run db:types" && exit 1)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: french_exam_rls_test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # See the note at the top of this file on why not `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
